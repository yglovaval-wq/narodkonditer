<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Народный кондитер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="wrapper">
        <header class="container">
            <span class="logo">Народный кондитер</span>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#cakes">Торты</a></li>
                    <li><a href="index.html#contacts">Контакты</a></li>
                    <li class="active"><a href="cart.html">Корзина <span id="cartCountBadge" class="cart-badge" style="display:none;">0</span></a></li>
                    <li class="btn"><a href="login.html">Вход</a></li>
                </ul>
            </nav>
        </header>

        <section class="cart-section">
            <div class="container">
                <div class="section-title">
                    <h2>Ваша <span>Корзина</span></h2>
                </div>

                <!-- Пустая корзина -->
                <div id="emptyCartView" class="cart-empty-box" style="display: none;">
                    <div class="cart-empty-icon">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </div>
                    <h3>Ваша корзина пуста</h3>
                    <p>Самое время выбрать вкуснейший торт!</p>
                    <a href="index.html#cakes" class="btn-cart-action">Перейти к тортам</a>
                    <div class="cart-total">
                        <span>Итого: 0 ₽</span>
                    </div>
                </div>

                <!-- Заполненная корзина -->
                <div id="fullCartView" class="cart-full-box" style="display: none;">
                    <div id="cartItemsList" class="cart-items-list"></div>

                    <div class="cart-summary-footer">
                        <div class="cart-total-price">
                            Итого: <span id="cartTotalPrice">0</span> ₽
                        </div>
                        <button class="btn-cart-action" onclick="checkout()">Оформить заказ</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('bakeryCart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('bakeryCart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cart = getCart();
            const emptyView = document.getElementById('emptyCartView');
            const fullView = document.getElementById('fullCartView');
            const itemsList = document.getElementById('cartItemsList');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            const badge = document.getElementById('cartCountBadge');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (badge) {
                if (totalCount > 0) {
                    badge.textContent = totalCount;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }

            if (cart.length === 0) {
                emptyView.style.display = 'block';
                fullView.style.display = 'none';
            } else {
                emptyView.style.display = 'none';
                fullView.style.display = 'block';

                itemsList.innerHTML = '';
                let totalSum = 0;

                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    totalSum += itemTotal;

                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `
                        <img src="${item.img}" alt="${item.name}" class="cart-item-img">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <span class="cart-item-price">${item.price.toLocaleString('ru-RU')} ₽</span>
                        </div>
                        <div class="cart-qty-controls">
                            <button onclick="changeQty(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <div class="cart-item-sum">${itemTotal.toLocaleString('ru-RU')} ₽</div>
                        <button class="cart-remove-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash-can"></i></button>
                    `;
                    itemsList.appendChild(row);
                });

                totalPriceEl.textContent = totalSum.toLocaleString('ru-RU');
            }
        }

        function changeQty(index, delta) {
            let cart = getCart();
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            saveCart(cart);
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
        }

        function checkout() {
            alert('Заказ успешно оформлен! Наш менеджер свяжется с вами.');
            localStorage.removeItem('bakeryCart');
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
